<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wetter">
<title>Wetter Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:transparent;
    overflow:hidden;
    color:#fff;
    font-family:'Barlow',system-ui,-apple-system,sans-serif;
    display:flex;align-items:flex-start;justify-content:flex-start;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
            max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;
  }
  body[data-align="right"]{justify-content:flex-end}
  body[data-align="center"]{justify-content:center}
  /* Ohne OBS (iPad/Browser) braucht die weiße Schrift einen dunklen Grund */
  body.solo{background:#101216;align-items:center;justify-content:center}

  .wx{
    display:flex;align-items:center;gap:16px;
    /* dezenter Schatten hält die Schrift auch über hellem Videobild lesbar */
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));
    opacity:0;animation:enter .5s ease forwards;
  }
  @keyframes enter{to{opacity:1}}

  .icon{width:var(--icon,58px);height:var(--icon,58px);flex:none;color:#fff}
  .icon svg{width:100%;height:100%;display:block;overflow:visible}

  .text{display:flex;flex-direction:column;gap:2px;line-height:1}
  .city{
    font-family:'Barlow Condensed','Barlow',sans-serif;
    font-size:calc(var(--icon,58px)*.29);
    font-weight:500;letter-spacing:.2em;text-transform:uppercase;
    opacity:.82;white-space:nowrap;
  }
  .now{
    font-size:calc(var(--icon,58px)*.42);
    font-weight:400;white-space:nowrap;letter-spacing:.005em;
  }
  .now .deg{
    font-family:'Barlow Condensed','Barlow',sans-serif;
    font-weight:500;font-variant-numeric:tabular-nums;
  }
  .now .sep{opacity:.45;margin:0 .5em}

  .status{font-size:14px;color:rgba(255,255,255,.7);letter-spacing:.02em}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes drop{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(11px);opacity:0}}
  @keyframes flake{0%{transform:translateY(-2px) rotate(0);opacity:0}25%{opacity:1}100%{transform:translateY(11px) rotate(140deg);opacity:0}}
  @keyframes flash{0%,88%,100%{opacity:.3}90%,96%{opacity:1}}
  @keyframes drift{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:translateX(-3px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  .a-spin{animation:spin 24s linear infinite;transform-origin:center}
  .a-pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}
  .a-cloud{animation:bob 5s ease-in-out infinite}
  .a-drop{animation:drop 1.4s linear infinite}
  .a-flake{animation:flake 2.6s linear infinite;transform-origin:center}
  .a-flash{animation:flash 3.2s linear infinite}
  .a-drift{animation:drift 6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="wx" id="wx"><div class="status">Wetterdaten werden geladen …</div></div>

<script>
/* ------------------------------------------------------------------
   Läuft unverändert in OBS (transparent) und im Browser/auf dem iPad
   (dunkler Grund, damit die weiße Schrift lesbar bleibt).
   Parameter: ?lat= &lon= &city= &refresh= (Sekunden) &align=left|center|right
              &size= (Icon-Höhe in px, Standard 58)
------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);
const CFG = {
  lat:     parseFloat(P.get('lat')  ?? '48.0069'),
  lon:     parseFloat(P.get('lon')  ?? '9.6567'),
  city:    P.get('city') ?? 'Bad Schussenried',
  refresh: Math.max(60, parseInt(P.get('refresh') ?? '600', 10)) * 1000,
  align:   P.get('align') ?? 'left',
  size:    parseInt(P.get('size') ?? '58', 10)
};
document.body.dataset.align = CFG.align;
document.documentElement.style.setProperty('--icon', CFG.size + 'px');
if(!window.obsstudio) document.body.classList.add('solo');

/* ---------- Icons ---------- */
const cloudPath = 'M20 44h22a9 9 0 0 0 .6-18 13 13 0 0 0-24.4-3A9.5 9.5 0 0 0 20 44Z';
const S = i => `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6"
  stroke-linecap="round" stroke-linejoin="round">${i}</svg>`;
const rays = (cx=32,cy=32,r1=15,r2=21) => {
  let o='';
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    o+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}"
             x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}"/>`;
  }
  return `<g class="a-spin" style="transform-origin:${cx}px ${cy}px">${o}</g>`;
};
const drops = (y=46) => [22,32,42].map((x,i)=>
  `<line x1="${x}" y1="${y}" x2="${x-2}" y2="${y+5}" class="a-drop" style="animation-delay:${i*.28}s"/>`).join('');
const flakes = (y=47) => [22,32,42].map((x,i)=>
  `<g class="a-flake" style="animation-delay:${i*.5}s">
     <line x1="${x-3}" y1="${y}" x2="${x+3}" y2="${y}"/>
     <line x1="${x}" y1="${y-3}" x2="${x}" y2="${y+3}"/></g>`).join('');

const ICONS = {
  sun:       () => S(`${rays()}<circle cx="32" cy="32" r="11" class="a-pulse"/>`),
  moon:      () => S(`<path class="a-pulse" d="M40 12a20 20 0 1 0 12 30A21 21 0 0 1 40 12Z"/>`),
  sunCloud:  () => S(`${rays(24,21,11,15)}<circle cx="24" cy="21" r="8"/><path class="a-cloud" d="${cloudPath}"/>`),
  moonCloud: () => S(`<path d="M30 10a13 13 0 1 0 8 20 13.5 13.5 0 0 1-8-20Z"/><path class="a-cloud" d="${cloudPath}"/>`),
  cloud:     () => S(`<path class="a-cloud" d="${cloudPath}"/>
                      <path class="a-cloud" style="animation-delay:1.2s;opacity:.45" d="M12 34h10"/>`),
  fog:       () => S(`<path d="${cloudPath}"/><g class="a-drift"><line x1="16" y1="52" x2="42" y2="52"/></g>
                      <g class="a-drift" style="animation-delay:1.5s;opacity:.6"><line x1="22" y1="58" x2="48" y2="58"/></g>`),
  drizzle:   () => S(`<path d="${cloudPath}"/>${drops(48)}`),
  rain:      () => S(`<path d="${cloudPath}"/>${drops(46)}
                      <line x1="27" y1="52" x2="25" y2="57" class="a-drop" style="animation-delay:.7s"/>
                      <line x1="37" y1="52" x2="35" y2="57" class="a-drop" style="animation-delay:1s"/>`),
  snow:      () => S(`<path d="${cloudPath}"/>${flakes(50)}`),
  sleet:     () => S(`<path d="${cloudPath}"/>${drops(47)}${flakes(54)}`),
  thunder:   () => S(`<path d="${cloudPath}"/>
                      <path class="a-flash" d="M34 46l-9 8h8l-3 8 10-9h-8l2-7Z" fill="currentColor" stroke="none"/>`),
  showers:   () => S(`${rays(24,19,10,14)}<circle cx="24" cy="19" r="7"/><path d="${cloudPath}"/>${drops(48)}`)
};

/* ---------- WMO-Codes → Text + Icon ---------- */
function decode(code, isDay){
  const d = isDay;
  if(code===0)             return ['Sonnig',                d?'sun':'moon'];
  if(code===1)             return ['Überwiegend sonnig',    d?'sun':'moon'];
  if(code===2)             return ['Teils bewölkt',         d?'sunCloud':'moonCloud'];
  if(code===3)             return ['Bewölkt',               'cloud'];
  if(code===45||code===48) return ['Nebel',                 'fog'];
  if(code>=51&&code<=57)   return ['Nieselregen',           'drizzle'];
  if(code>=61&&code<=65)   return ['Regen',                 'rain'];
  if(code===66||code===67) return ['Gefrierender Regen',    'sleet'];
  if(code>=71&&code<=75)   return ['Schneefall',            'snow'];
  if(code===77)            return ['Schneegriesel',         'snow'];
  if(code>=80&&code<=82)   return ['Regenschauer',          'showers'];
  if(code===85||code===86) return ['Schneeschauer',         'snow'];
  if(code===95)            return ['Gewitter',              'thunder'];
  if(code===96||code===99) return ['Gewitter mit Hagel',    'thunder'];
  return ['Keine Angabe','cloud'];
}
</script>
<script>
const wx  = document.getElementById('wx');
const API = 'https://api.open-meteo.com/v1/forecast'
  + `?latitude=${CFG.lat}&longitude=${CFG.lon}`
  + '&current=temperature_2m,is_day,weather_code&timezone=auto';

function render(data){
  const c = data.current;
  const [label, icon] = decode(c.weather_code, c.is_day === 1);
  wx.innerHTML = `
    <div class="icon">${ICONS[icon]()}</div>
    <div class="text">
      <div class="city">${CFG.city}</div>
      <div class="now">${label}<span class="sep">·</span><span class="deg">${Math.round(c.temperature_2m)} °C</span></div>
    </div>`;
}

let retry = 0;
async function update(){
  try{
    const res = await fetch(API, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    render(await res.json());
    retry = 0;
  }catch(e){
    retry++;
    wx.innerHTML = `<div class="status">${retry>3
      ? 'Keine Verbindung zum Wetterdienst. Netzwerk prüfen.'
      : 'Aktualisierung fehlgeschlagen – neuer Versuch …'}</div>`;
    setTimeout(update, Math.min(60000, 5000*retry));
  }
}
update();
setInterval(update, CFG.refresh);
if(!window.obsstudio){
  document.addEventListener('click', update);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) update(); });
}
</script>
</body>
</html>
