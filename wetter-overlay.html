<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wetter">
<meta name="theme-color" content="#0E1116">
<title>Wetter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#8FA0B4;
    --fg:#F2F5F8;
    --fg-dim:rgba(242,245,248,.58);
    --line:rgba(255,255,255,.10);
    --panel:rgba(14,17,22,.78);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Barlow',system-ui,-apple-system,sans-serif;
    color:var(--fg);
    background:transparent;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  .cond-label{font-weight:500}
  .place{
    font-family:'Barlow Condensed','Barlow',sans-serif;
    font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-dim);
  }
  .num{font-family:'Barlow Condensed','Barlow',sans-serif;font-variant-numeric:tabular-nums}
  .icon svg{width:100%;height:100%;display:block;overflow:visible}
  .icon{color:var(--accent);transition:color .8s ease}
  .mini *{animation:none !important}

/* ==================== OBS-Overlay-Modus ==================== */
  body.obs{display:flex;align-items:flex-start;justify-content:flex-start;padding:8px}
  body.obs[data-align="right"]{justify-content:flex-end}
  body.obs[data-align="center"]{justify-content:center}
  body.obs[data-theme="light"]{--panel:rgba(248,250,252,.86);--fg:#0E1116;--fg-dim:rgba(14,17,22,.55);--line:rgba(14,17,22,.10)}
  body.obs .app{display:none}
  body.obs .card{
    position:relative;display:flex;align-items:center;gap:14px;
    padding:12px 20px 12px 16px;
    background:var(--panel);
    border:1px solid var(--line);border-radius:4px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 28px rgba(0,0,0,.28);
    opacity:0;transform:translateY(6px);
    animation:enter .55s cubic-bezier(.2,.8,.2,1) forwards;
    overflow:hidden;
  }
  body.obs .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--accent);transition:background .8s ease;
  }
  body.obs .card .icon{width:52px;height:52px;flex:none}
  body.obs .card .temp{font-size:52px;font-weight:500;line-height:.86;letter-spacing:-.01em}
  body.obs .card .temp sup{font-size:20px;font-weight:400;vertical-align:top;margin-left:2px;color:var(--fg-dim)}
  body.obs .card .meta{display:flex;flex-direction:column;gap:3px}
  body.obs .card .cond-label{font-size:15px;white-space:nowrap}
  body.obs .card .place{font-size:12px;white-space:nowrap}
  body.obs .card .rule{width:1px;align-self:stretch;background:var(--line)}
  body.obs .card .stats{display:flex;flex-direction:column;gap:4px}
  body.obs .card .stat{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--fg-dim);white-space:nowrap}
  body.obs .card .stat b{font-size:15px;font-weight:500;color:var(--fg)}
  body.obs .card .key{letter-spacing:.1em;text-transform:uppercase;font-size:10px}

/* ==================== iPad-/Browser-Modus ==================== */
  body.app{
    background:#0B0E13;
    display:flex;flex-direction:column;
    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right))
            max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  }
  body.app .card{display:none}
  /* Signatur: der Raum selbst nimmt die Farbe der Wetterlage an */
  body.app::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(120% 80% at 78% -10%, color-mix(in srgb, var(--accent) 42%, transparent), transparent 62%),
      radial-gradient(90% 70% at 8% 110%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%);
    transition:background 1.2s ease;
  }
  .app{display:flex;flex-direction:column;gap:clamp(18px,3.2vh,34px);height:100%;
       max-width:860px;width:100%;margin:0 auto;justify-content:center}

  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
        border-bottom:1px solid var(--line);padding-bottom:10px}
  .head .place{font-size:clamp(13px,1.7vw,16px)}
  .head .updated{font-size:12px;color:var(--fg-dim);letter-spacing:.04em}

  .hero{display:flex;align-items:center;gap:clamp(16px,3vw,40px)}
  .hero .icon{width:clamp(84px,13vw,132px);height:clamp(84px,13vw,132px);flex:none}
  .hero .temp{font-size:clamp(88px,15vw,168px);font-weight:300;line-height:.82;letter-spacing:-.03em}
  .hero .temp sup{font-size:.28em;font-weight:400;vertical-align:top;color:var(--fg-dim);margin-left:.06em}
  .hero .meta{display:flex;flex-direction:column;gap:6px;margin-left:auto;text-align:right}
  .hero .cond-label{font-size:clamp(18px,2.6vw,26px)}
  .hero .range{font-size:clamp(15px,2vw,19px);color:var(--fg-dim)}

  .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
         border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .fact{background:#0B0E13;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .fact .key{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim)}
  .fact .val{font-size:clamp(20px,2.6vw,26px);font-weight:400}
  .fact .val small{font-size:.5em;color:var(--fg-dim);margin-left:3px}

  .hours{display:flex;gap:clamp(6px,1.4vw,18px);justify-content:space-between}
  .hour{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;min-width:0}
  .hour .t{font-size:11px;letter-spacing:.1em;color:var(--fg-dim)}
  .hour .icon{width:clamp(24px,3.2vw,34px);height:clamp(24px,3.2vw,34px)}
  .hour .v{font-size:clamp(15px,2vw,19px)}
  .hour .p{font-size:10px;color:var(--accent);letter-spacing:.04em;min-height:12px;transition:color .8s ease}

  .days{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .day{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .day .wd{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim);width:52px}
  .day .icon{width:26px;height:26px;flex:none}
  .day .lbl{font-size:14px;color:var(--fg-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .day .rng{font-size:17px;letter-spacing:.02em}
  .day .rng .lo{color:var(--fg-dim);margin-right:9px}

  @media (max-width:640px){
    .facts{grid-template-columns:repeat(2,1fr)}
    .hero .meta{margin-left:0;text-align:left;width:100%}
    .hero{flex-wrap:wrap}
    .hour:nth-child(n+6){display:none}
  }
  @media (max-height:520px){ .days,.hours{display:none} }

/* ==================== gemeinsam ==================== */
  .status{font-size:13px;color:var(--fg-dim);padding:10px 14px;letter-spacing:.02em}
  body.app .status{align-self:center;margin:auto}
  @keyframes enter{to{opacity:1;transform:none}}
  .fade{animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes drop{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(11px);opacity:0}}
  @keyframes flake{0%{transform:translateY(-2px) rotate(0);opacity:0}25%{opacity:1}100%{transform:translateY(11px) rotate(140deg);opacity:0}}
  @keyframes flash{0%,88%,100%{opacity:.25}90%,96%{opacity:1}}
  @keyframes drift{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:translateX(-3px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  .a-spin{animation:spin 24s linear infinite;transform-origin:center}
  .a-pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}
  .a-cloud{animation:bob 5s ease-in-out infinite}
  .a-drop{animation:drop 1.4s linear infinite}
  .a-flake{animation:flake 2.6s linear infinite;transform-origin:center}
  .a-flash{animation:flash 3.2s linear infinite}
  .a-drift{animation:drift 6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
  <div class="card" id="card"><div class="status">Wetterdaten werden geladen …</div></div>
  <div class="app" id="app"><div class="status">Wetterdaten werden geladen …</div></div>

<script>
/* ------------------------------------------------------------------
   Läuft in zwei Modi – die Erkennung passiert automatisch:
     OBS   → transparenter Hintergrund, kompaktes Panel
     App   → Vollbild-Ansicht für iPad/Browser mit Stunden- und Tagesvorschau
   Erzwingen mit ?mode=obs oder ?mode=app
   Weitere Parameter: lat, lon, city, refresh (Sekunden),
                      align (left|center|right), theme (dark|light)
   Beispiel: wetter-overlay.html?city=Ulm&lat=48.4011&lon=9.9876&mode=app
------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);
const CFG = {
  lat:     parseFloat(P.get('lat')  ?? '48.0069'),
  lon:     parseFloat(P.get('lon')  ?? '9.6567'),
  city:    P.get('city') ?? 'Bad Schussenried',
  refresh: Math.max(60, parseInt(P.get('refresh') ?? '600', 10)) * 1000,
  align:   P.get('align') ?? 'left',
  theme:   P.get('theme') ?? 'dark'
};
const forced = P.get('mode');
const IS_OBS = forced ? forced === 'obs' : !!window.obsstudio;
document.body.classList.add(IS_OBS ? 'obs' : 'app');
document.body.dataset.align = CFG.align;
document.body.dataset.theme = CFG.theme;

/* ---------- Icons ---------- */
const cloudPath = 'M20 44h22a9 9 0 0 0 .6-18 13 13 0 0 0-24.4-3A9.5 9.5 0 0 0 20 44Z';
const S = i => `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6"
  stroke-linecap="round" stroke-linejoin="round">${i}</svg>`;
const rays = (cx=32,cy=32,r1=15,r2=21) => {
  let o='';
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    o+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}"
             x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}"/>`;
  }
  return `<g class="a-spin" style="transform-origin:${cx}px ${cy}px">${o}</g>`;
};
const drops = (y=46) => [22,32,42].map((x,i)=>
  `<line x1="${x}" y1="${y}" x2="${x-2}" y2="${y+5}" class="a-drop" style="animation-delay:${i*.28}s"/>`).join('');
const flakes = (y=47) => [22,32,42].map((x,i)=>
  `<g class="a-flake" style="animation-delay:${i*.5}s">
     <line x1="${x-3}" y1="${y}" x2="${x+3}" y2="${y}"/>
     <line x1="${x}" y1="${y-3}" x2="${x}" y2="${y+3}"/></g>`).join('');

const ICONS = {
  sun:       () => S(`${rays()}<circle cx="32" cy="32" r="11" class="a-pulse"/>`),
  moon:      () => S(`<path class="a-pulse" d="M40 12a20 20 0 1 0 12 30A21 21 0 0 1 40 12Z"/>`),
  sunCloud:  () => S(`${rays(24,21,11,15)}<circle cx="24" cy="21" r="8"/><path class="a-cloud" d="${cloudPath}"/>`),
  moonCloud: () => S(`<path d="M30 10a13 13 0 1 0 8 20 13.5 13.5 0 0 1-8-20Z"/><path class="a-cloud" d="${cloudPath}"/>`),
  cloud:     () => S(`<path class="a-cloud" d="${cloudPath}"/>
                      <path class="a-cloud" style="animation-delay:1.2s;opacity:.45" d="M12 34h10"/>`),
  fog:       () => S(`<path d="${cloudPath}"/><g class="a-drift"><line x1="16" y1="52" x2="42" y2="52"/></g>
                      <g class="a-drift" style="animation-delay:1.5s;opacity:.6"><line x1="22" y1="58" x2="48" y2="58"/></g>`),
  drizzle:   () => S(`<path d="${cloudPath}"/>${drops(48)}`),
  rain:      () => S(`<path d="${cloudPath}"/>${drops(46)}
                      <line x1="27" y1="52" x2="25" y2="57" class="a-drop" style="animation-delay:.7s"/>
                      <line x1="37" y1="52" x2="35" y2="57" class="a-drop" style="animation-delay:1s"/>`),
  snow:      () => S(`<path d="${cloudPath}"/>${flakes(50)}`),
  sleet:     () => S(`<path d="${cloudPath}"/>${drops(47)}${flakes(54)}`),
  thunder:   () => S(`<path d="${cloudPath}"/>
                      <path class="a-flash" d="M34 46l-9 8h8l-3 8 10-9h-8l2-7Z" fill="currentColor" stroke="none"/>`),
  showers:   () => S(`${rays(24,19,10,14)}<circle cx="24" cy="19" r="7"/><path d="${cloudPath}"/>${drops(48)}`)
};

/* ---------- WMO-Codes → Text, Icon, Akzentfarbe ---------- */
const A = {sun:'#FFB23F',night:'#9DB2E8',cloud:'#A6B3C2',fog:'#B3B9BF',rain:'#4FA3E3',snow:'#8FDCEF',storm:'#A98BF5'};
function decode(code, isDay){
  const d = isDay;
  if(code===0)                 return ['Klar',                 d?'sun':'moon',           d?A.sun:A.night];
  if(code===1)                 return ['Überwiegend klar',     d?'sun':'moon',           d?A.sun:A.night];
  if(code===2)                 return ['Teils bewölkt',        d?'sunCloud':'moonCloud', d?A.sun:A.night];
  if(code===3)                 return ['Bedeckt',              'cloud',   A.cloud];
  if(code===45||code===48)     return ['Nebel',                'fog',     A.fog];
  if(code>=51&&code<=57)       return ['Nieselregen',          'drizzle', A.rain];
  if(code>=61&&code<=65)       return ['Regen',                'rain',    A.rain];
  if(code===66||code===67)     return ['Gefrierender Regen',   'sleet',   A.snow];
  if(code>=71&&code<=75)       return ['Schneefall',           'snow',    A.snow];
  if(code===77)                return ['Schneegriesel',        'snow',    A.snow];
  if(code>=80&&code<=82)       return ['Regenschauer',         'showers', A.rain];
  if(code===85||code===86)     return ['Schneeschauer',        'snow',    A.snow];
  if(code===95)                return ['Gewitter',             'thunder', A.storm];
  if(code===96||code===99)     return ['Gewitter mit Hagel',   'thunder', A.storm];
  return ['Keine Angabe','cloud',A.cloud];
}

/* ---------- Daten ---------- */
const card = document.getElementById('card');
const app  = document.getElementById('app');
const API  = 'https://api.open-meteo.com/v1/forecast'
  + `?latitude=${CFG.lat}&longitude=${CFG.lon}`
  + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m'
  + '&hourly=temperature_2m,weather_code,precipitation_probability,is_day&forecast_hours=8'
  + '&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=4'
  + '&timezone=auto';
const r0 = n => Math.round(n);
const hhmm = iso => iso.slice(11,16);
const wd = iso => new Date(iso).toLocaleDateString('de-DE',{weekday:'short'}).replace('.','');

function paint(accent){
  document.documentElement.style.setProperty('--accent', accent);
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta && !IS_OBS) meta.content = '#0B0E13';
}

function renderOBS(d){
  const c=d.current, dy=d.daily;
  const [label,icon,accent]=decode(c.weather_code,c.is_day===1);
  paint(accent);
  card.innerHTML = `
    <div class="icon">${ICONS[icon]()}</div>
    <div class="temp num">${r0(c.temperature_2m)}<sup>°C</sup></div>
    <div class="meta">
      <div class="cond-label">${label}</div>
      <div class="place">${CFG.city}</div>
    </div>
    <div class="rule"></div>
    <div class="stats">
      <div class="stat"><span class="key">Max</span><b class="num">${r0(dy.temperature_2m_max[0])}°</b>
        <span class="key">Min</span><b class="num">${r0(dy.temperature_2m_min[0])}°</b></div>
      <div class="stat"><span class="key">Gef.</span><b class="num">${r0(c.apparent_temperature)}°</b>
        <span class="key">Wind</span><b class="num">${r0(c.wind_speed_10m)}</b> km/h</div>
    </div>`;
  card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade');
}

function renderApp(d){
  const c=d.current, h=d.hourly, dy=d.daily;
  const [label,icon,accent]=decode(c.weather_code,c.is_day===1);
  paint(accent);

  const hours = h.time.map((t,i)=>{
    const [,ic]=decode(h.weather_code[i], h.is_day[i]===1);
    const p=h.precipitation_probability?.[i] ?? 0;
    return `<div class="hour">
      <div class="t num">${i===0?'jetzt':hhmm(t)}</div>
      <div class="icon mini">${ICONS[ic]()}</div>
      <div class="v num">${r0(h.temperature_2m[i])}°</div>
      <div class="p num">${p>=20?p+'%':''}</div>
    </div>`;
  }).join('');

  const days = dy.time.slice(1).map((t,i)=>{
    const k=i+1;
    const [lbl,ic]=decode(dy.weather_code[k], true);
    return `<div class="day">
      <div class="wd">${wd(t)}</div>
      <div class="icon mini">${ICONS[ic]()}</div>
      <div class="lbl">${lbl}</div>
      <div class="rng num"><span class="lo">${r0(dy.temperature_2m_min[k])}°</span>${r0(dy.temperature_2m_max[k])}°</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="head">
      <div class="place">${CFG.city}</div>
      <div class="updated num">Stand ${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="hero">
      <div class="icon">${ICONS[icon]()}</div>
      <div class="temp num">${r0(c.temperature_2m)}<sup>°</sup></div>
      <div class="meta">
        <div class="cond-label">${label}</div>
        <div class="range num">${r0(dy.temperature_2m_min[0])}° – ${r0(dy.temperature_2m_max[0])}°</div>
      </div>
    </div>
    <div class="facts">
      <div class="fact"><div class="key">Gefühlt</div><div class="val num">${r0(c.apparent_temperature)}°</div></div>
      <div class="fact"><div class="key">Wind</div><div class="val num">${r0(c.wind_speed_10m)}<small>km/h</small></div></div>
      <div class="fact"><div class="key">Luftfeuchte</div><div class="val num">${r0(c.relative_humidity_2m)}<small>%</small></div></div>
      <div class="fact"><div class="key">Regen 8 Std.</div><div class="val num">${Math.max(...(h.precipitation_probability ?? [0]))}<small>%</small></div></div>
    </div>
    <div class="hours">${hours}</div>
    <div class="days">${days}</div>`;
  app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade');
}

let retry = 0, timer = null;
function showStatus(text){
  const html = `<div class="status">${text}</div>`;
  (IS_OBS ? card : app).innerHTML = html;
}
async function update(){
  try{
    const res = await fetch(API, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    IS_OBS ? renderOBS(data) : renderApp(data);
    retry = 0;
  }catch(e){
    retry++;
    showStatus(retry>3 ? 'Keine Verbindung zum Wetterdienst. Netzwerk prüfen.'
                       : 'Aktualisierung fehlgeschlagen – neuer Versuch …');
    setTimeout(update, Math.min(60000, 5000*retry));
  }
}

update();
timer = setInterval(update, CFG.refresh);

/* App-Modus: Tippen aktualisiert, Rückkehr aus dem Hintergrund ebenfalls,
   und das Display bleibt an, solange die Ansicht offen ist. */
if(!IS_OBS){
  document.addEventListener('click', update);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) update(); });
  let lock = null;
  const keepAwake = async () => {
    try{ if('wakeLock' in navigator && !document.hidden) lock = await navigator.wakeLock.request('screen'); }catch(e){}
  };
  keepAwake();
  document.addEventListener('visibilitychange', keepAwake);
}
</script></body></html>
